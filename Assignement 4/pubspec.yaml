name: wheather_app
description: A modern weather app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌐 API calls
  http: ^1.2.0

  # ⚙️ State management
  provider: ^6.1.2

  # 🎨 UI Icons
  cupertino_icons: ^1.0.8

  # 📱 Preferences
  shared_preferences: ^2.2.3

  # 📍 Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # 📅 Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true