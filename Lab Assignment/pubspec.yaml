name: number_guess_game
description: A Flutter Number Guessing Game with SQLite database
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # SQLite database
  sqflite: ^2.3.0

  # Path for database location
  path: ^1.8.3

  # Cupertino icons (default Flutter icons)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true